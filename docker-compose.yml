services:
  base:
    image: anansi
    build:
      context: .
      target: development

  server:
    image: anansi
    build:
      context: .
      target: development
    environment:
      - PG_PASSWORD=${PG_PASSWORD}
    command: npm run dev --workspace=apps/server
    volumes:
      - .:/app
      - server_root_modules:/app/node_modules
      - server_workspace_modules:/app/apps/server/node_modules
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:5002/health/ready"]
      retries: 2
      interval: 5s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: anansidb
      POSTGRES_USER: anansi
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anansi -d anansidb"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  server_root_modules:
  server_workspace_modules:
  postgres_data:
